version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/emoh-api-app
hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 600
      runas: ubuntu
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 600
      runas: ubuntu
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 600
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 600
      runas: ubuntu
  # ValidateService:
  #   - location: scripts/remove_env.sh
  #     timeout: 600
  #     runas: ubuntu
